<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Chapter Parser Tester</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 { margin-bottom: 10px; }
        .badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Upload Card */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: var(--primary);
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        /* Form Elements */
        input[type="file"] {
            display: none;
        }

        .file-label {
            cursor: pointer;
            padding: 10px 20px;
            background: #eef2ff;
            color: var(--primary);
            border-radius: 6px;
            font-weight: 500;
        }

        button.process-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.process-btn:hover { background-color: var(--primary-hover); }
        button.process-btn:disabled { background-color: var(--text-muted); cursor: not-allowed; }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 20px;
            display: none; /* Hidden by default */
        }

        .progress-bar-bg {
            background: var(--border);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        /* Logs Console */
        .console {
            background: #111827;
            color: #10b981;
            font-family: 'Fira Code', monospace;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            height: 150px;
            overflow-y: auto;
            margin-bottom: 20px;
            display: none; 
        }

        .console p { margin: 2px 0; }
        .console .error { color: #ef4444; }

        /* Results Display */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .batch-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .batch-header {
            background: #f9fafb;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .batch-content {
            padding: 15px;
            white-space: pre-wrap;
            font-family: serif;
            font-size: 1.1rem;
            line-height: 1.6;
            display: none; /* Collapsed by default */
            background: #fff;
        }
        
        .batch-content.open { display: block; }

        .meta-tag {
            background: #e5e7eb;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PDF Chapter Parser</h1>
        <span class="badge">API v3.0.0</span>
        <p style="color: var(--text-muted);">Upload a PDF to extract clean text batches using WebSocket streaming.</p>
    </header>

    <div class="card">
        <div class="upload-area" id="dropZone">
            <p id="fileNameDisplay" style="font-weight: 600; margin-bottom: 10px;">No file selected</p>
            <label for="pdfFile" class="file-label">Select PDF</label>
            <input type="file" id="pdfFile" accept=".pdf">
        </div>

        <div class="controls">
            <div class="checkbox-wrapper">
                <input type="checkbox" id="useAI" style="width: 18px; height: 18px;">
                <label for="useAI">Enable AI Cleaning (Llama-3 via Replicate)</label>
            </div>
            <button class="process-btn" id="processBtn" onclick="startProcessing()">
                Upload & Process
            </button>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="status-text">
                <span id="statusMessage">Waiting...</span>
                <span id="percentText">0%</span>
            </div>
        </div>
    </div>

    <div class="console" id="consoleLog">
        <p>> System ready.</p>
    </div>

    <div id="resultsArea" style="display:none;">
        <div class="results-header">
            <h2>Extraction Results</h2>
            <div>
                <span class="badge" id="totalWords">0 Words</span>
                <span class="badge" id="timeTaken">0s</span>
            </div>
        </div>
        <div id="batchList">
            </div>
    </div>
</div>

<script>
    // Configuration
    const API_BASE = "https://ebook-chapter-parse-production.up.railway.app";
    // Convert https to wss for WebSocket
    const WS_BASE = API_BASE.replace("https", "wss");

    // DOM Elements
    const fileInput = document.getElementById('pdfFile');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const processBtn = document.getElementById('processBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const statusMessage = document.getElementById('statusMessage');
    const percentText = document.getElementById('percentText');
    const consoleLog = document.getElementById('consoleLog');
    const resultsArea = document.getElementById('resultsArea');
    const batchList = document.getElementById('batchList');
    const useAI = document.getElementById('useAI');

    let selectedFile = null;
    let ws = null;

    // File Selection Handler
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            fileNameDisplay.textContent = `📄 ${selectedFile.name} (${(selectedFile.size / 1024 / 1024).toFixed(2)} MB)`;
            processBtn.disabled = false;
        }
    });

    // Logging Utility
    function log(msg, isError = false) {
        consoleLog.style.display = 'block';
        const p = document.createElement('p');
        const time = new Date().toLocaleTimeString();
        p.innerHTML = `<span style="opacity:0.5">[${time}]</span> ${msg}`;
        if (isError) p.className = 'error';
        consoleLog.appendChild(p);
        consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    async function startProcessing() {
        if (!selectedFile) {
            alert("Please select a file first");
            return;
        }

        // Reset UI
        processBtn.disabled = true;
        processBtn.innerHTML = '<div class="spinner"></div> Processing...';
        progressContainer.style.display = 'block';
        resultsArea.style.display = 'none';
        batchList.innerHTML = '';
        progressBar.style.width = '0%';
        consoleLog.innerHTML = '<p>> Initializing connection...</p>';

        // 1. Generate Client ID
        const clientId = 'client_' + Date.now();
        log(`Generated Client ID: ${clientId}`);

        // 2. Connect to WebSocket
        try {
            ws = new WebSocket(`${WS_BASE}/ws/${clientId}`);
            
            ws.onopen = () => {
                log("WebSocket connected. Starting upload...");
                uploadFile(clientId);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWsMessage(data);
            };

            ws.onerror = (error) => {
                log("WebSocket Error", true);
                console.error(error);
            };
            
            ws.onclose = () => {
                log("WebSocket disconnected.");
            };

        } catch (e) {
            log(`Connection failed: ${e.message}`, true);
            resetBtn();
        }
    }

    async function uploadFile(clientId) {
        const formData = new FormData();
        formData.append('file', selectedFile);
        
        // Determine endpoint based on checkbox
        const endpoint = useAI.checked ? '/process-pdf-with-ai' : '/process-pdf';
        // Add query params
        const url = `${API_BASE}${endpoint}?client_id=${clientId}${useAI.checked ? '&max_concurrent=5' : ''}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(errText);
            }

            const result = await response.json();
            renderResults(result);

        } catch (e) {
            log(`Upload/Process Error: ${e.message}`, true);
            statusMessage.textContent = "Error occurred";
            statusMessage.style.color = "red";
        } finally {
            resetBtn();
            if (ws) ws.close();
        }
    }

    function handleWsMessage(data) {
        if (data.type === 'progress') {
            const percent = data.progress || 0;
            progressBar.style.width = `${percent}%`;
            percentText.textContent = `${percent}%`;
            statusMessage.textContent = data.message;
            
            if (data.stage) {
                log(`[${data.stage}] ${data.message}`);
            }
        } else if (data.type === 'completed') {
            progressBar.style.width = '100%';
            percentText.textContent = '100%';
            statusMessage.textContent = 'Done!';
            log(`✅ ${data.message}`);
        } else if (data.type === 'error') {
            log(`❌ ${data.message}`, true);
        }
    }

    function renderResults(data) {
        resultsArea.style.display = 'block';
        document.getElementById('totalWords').textContent = `${data.total_words} words`;
        document.getElementById('timeTaken').textContent = `${data.processing_time_seconds.toFixed(2)}s`;

        data.page_batches.forEach(batch => {
            const batchDiv = document.createElement('div');
            batchDiv.className = 'batch-item';
            
            const isCleaned = batch.cleaned ? '<span class="meta-tag" style="background:#d1fae5; color:#065f46">AI Cleaned</span>' : '<span class="meta-tag">Raw Text</span>';

            batchDiv.innerHTML = `
                <div class="batch-header" onclick="toggleBatch(this)">
                    <span>
                        Batch #${batch.batch_number} 
                        <span class="meta-tag">Pages: ${batch.page_range}</span>
                        ${isCleaned}
                    </span>
                    <span>${batch.word_count} words ▼</span>
                </div>
                <div class="batch-content">${escapeHtml(batch.cleaned_text)}</div>
            `;
            batchList.appendChild(batchDiv);
        });
    }

    // Toggle Accordion
    window.toggleBatch = function(header) {
        const content = header.nextElementSibling;
        content.classList.toggle('open');
        const arrow = header.children[1];
        arrow.textContent = content.classList.contains('open') 
            ? arrow.textContent.replace('▼', '▲') 
            : arrow.textContent.replace('▲', '▼');
    };

    function resetBtn() {
        processBtn.disabled = false;
        processBtn.textContent = 'Upload & Process';
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
